name: Validate portfolio snapshot

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q analysis dashboard tests
      - name: Published output checks
        run: python -m unittest discover -s tests -v
      - name: Package tested source for local replay
        uses: actions/upload-artifact@v4
        with:
          name: maritime-tested-source
          path: |
            analysis/
            dashboard/
            docs/
            tests/
            requirements.txt
          retention-days: 1
